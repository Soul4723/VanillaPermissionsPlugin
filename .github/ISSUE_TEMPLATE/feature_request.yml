name: Feature request
description: Suggest a vanilla command, node or feature the plugin should cover
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        The nodes follow [DrexHD's VanillaPermissions](https://github.com/DrexHD/VanillaPermissions) for Fabric. A request that matches a node there is the most likely to be accepted.
        Check the [recipes](https://github.com/Soul4723/VanillaPermissionsPlugin/blob/main/docs/recipes.md) first: what you want may already be possible.

  - type: textarea
    attributes:
      label: What do you want to control?
      description: The command, selector or feature, and who should or should not be able to use it.
    validations:
      required: true

  - type: input
    attributes:
      label: Suggested node
      description: The permission node you would expect, if you have one in mind.
      placeholder: "minecraft.command.example"
    validations:
      required: false
