name: Feature request
description: Suggest a vanilla command, node or feature the plugin should cover
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        The nodes follow [DrexHD's VanillaPermissions](https://github.com/DrexHD/VanillaPermissions) for Fabric; requests that match a node there are most likely to be accepted.

  - type: textarea
    attributes:
      label: What do you want to control?
      description: The command, selector or feature, and who should or should not be able to use it.
    validations:
      required: true

  - type: input
    attributes:
      label: Suggested node
      description: The permission node you would expect, if you have one in mind.
      placeholder: "minecraft.command.example"
    validations:
      required: false
