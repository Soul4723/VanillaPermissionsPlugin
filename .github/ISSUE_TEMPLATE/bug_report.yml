name: Bug report
description: A node, command or selector does not work as the documentation says
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Before you report, check [Troubleshooting](https://github.com/Soul4723/VanillaPermissionsPlugin/blob/main/docs/troubleshooting.md) and the [supported servers](https://github.com/Soul4723/VanillaPermissionsPlugin/blob/main/docs/compatibility.md#supported-servers).

  - type: input
    attributes:
      label: Plugin version
      description: The jar name, or the output of `/version VanillaPermissionsPlugin`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    attributes:
      label: Server software and version
      description: The output of `/version` in the console.
      placeholder: "Paper 1.21.11-132, Spigot 1.20.4, Purpur 26.3 ..."
    validations:
      required: true

  - type: input
    attributes:
      label: Permissions plugin and version
      description: For example LuckPerms 5.5.88, or "none". Say if Vault is installed.
    validations:
      required: true

  - type: textarea
    attributes:
      label: "`/vanillapermissions debug` output"
      description: Run it in the console and paste the result. If the plugin turned itself off, say so and paste the startup log below.
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened
      description: What you expected to happen, and what happened instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The exact commands, who ran them, whether that player is an operator, and the permissions they have. `/vanillapermissions check <player> <node>` output helps.
      placeholder: |
        1. `/lp group staff permission set minecraft.command.gamemode true`
        2. `/lp user Steve parent add staff`
        3. Steve, who is not an operator, runs `/gamemode creative`
        4. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs and other plugins
      description: Any error from the console, and other plugins that change commands, such as EssentialsX or CommandAPI. Paste long logs to https://mclo.gs and link them.
    validations:
      required: false
