name: Bug report
description: A command, selector or bypass node does not behave as documented
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://github.com/Soul4723/VanillaPermissionsPlugin/tree/main/docs) and the [supported servers](https://github.com/Soul4723/VanillaPermissionsPlugin/blob/main/docs/compatibility.md) first.

  - type: input
    attributes:
      label: Plugin version
      description: The jar name, or `/version VanillaPermissionsPlugin`.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    attributes:
      label: Server software and version
      description: The output of `/version` in the console.
      placeholder: "Paper 1.21.11-132, Spigot 1.20.4, Purpur 26.3 ..."
    validations:
      required: true

  - type: input
    attributes:
      label: Permissions plugin and version
      description: For example LuckPerms 5.5.x, or "none". Mention Vault if it is installed.
    validations:
      required: true

  - type: textarea
    attributes:
      label: "`/vanillapermissions debug` output"
      description: Run it in the console and paste the result. If the plugin did not enable, say so and paste the startup log below.
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The exact commands, who ran them (operator or not) and the permissions that player has.
      placeholder: |
        1. `/lp user Steve permission set minecraft.command.gamemode.creative true`
        2. Steve (not an operator) runs `/gamemode creative`
        3. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs and other plugins
      description: Any error from the console (use https://mclo.gs for long logs), and plugins that change commands, such as Essentials or CommandAPI.
    validations:
      required: false
