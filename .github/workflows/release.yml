name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      has-notes: ${{ steps.notes.outputs.has-notes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check tag matches pom version
        id: version
        run: |
          pom_version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$pom_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$pom_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $pom_version"
            exit 1
          fi

      - run: mvn -B -ntp verify

      - name: Checksum and release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd target
          sha256sum "VanillaPermissionsPlugin-$VERSION.jar" > "VanillaPermissionsPlugin-$VERSION.jar.sha256"
          cd ..
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then echo "has-notes=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            target/VanillaPermissionsPlugin-*.jar
            target/VanillaPermissionsPlugin-*.jar.sha256
            release-notes.md
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            target/VanillaPermissionsPlugin-${{ needs.release.outputs.version }}.jar
            target/VanillaPermissionsPlugin-${{ needs.release.outputs.version }}.jar.sha256
          body_path: ${{ needs.release.outputs.has-notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ needs.release.outputs.has-notes != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
