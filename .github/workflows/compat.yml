name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Twice weekly, so the Spigot jar caches below are used again before GitHub evicts entries unused for 7 days.
  schedule:
    - cron: '17 4 * * 1,4'

permissions:
  contents: read

env:
  # Pinned (build 201, git-BuildTools-5fc1010-201) instead of lastSuccessfulBuild so runs are reproducible; bump with its
  # sha256 from https://hub.spigotmc.org/jenkins/job/BuildTools/. The Spigot cache keys carry the build number.
  BUILDTOOLS_BUILD: 201
  BUILDTOOLS_SHA256: 81ed06f5ce5fb705b558bf9b3cc2c5c53cdd9742406c5338c452faa13a1e1c24

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: compat jar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v7
        with:
          name: VanillaPermissionsPlugin-compat
          path: target/VanillaPermissionsPlugin-*.jar
          if-no-files-found: error

  # Spigot cannot be downloaded or redistributed, so each revision is built once with BuildTools and kept only in
  # actions/cache (never uploaded as an artifact). Adopted from SpraxDev/Action-SpigotMC (action.yml, src/index.ts)
  # and Jannyboy11/InvSee-plus-plus (workflows/build.yml): `java -jar BuildTools.jar --rev <v> --compile ...` under
  # the JDK each revision needs, skipped when the output already exists. BuildTools is pinned by build number and sha256,
  # and the cache is keyed on both.
  spigot-jar:
    name: spigot jar ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # JDK per revision: Java 8 up to 1.16.5, 17 for 1.17.x - 1.20.4 (1.17 also runs on 16), 21 for 1.20.5 - 1.21.11,
        # 25 for 26.x.
        include:
          - { minecraft: '1.8.8', java: 8 }
          - { minecraft: '1.12.2', java: 8 }
          - { minecraft: '1.13.2', java: 8 }
          - { minecraft: '1.16.5', java: 8 }
          - { minecraft: '1.17.1', java: 17 }
          - { minecraft: '1.18.2', java: 17 }
          - { minecraft: '1.19.4', java: 17 }
          - { minecraft: '1.20.4', java: 17 }
          - { minecraft: '1.20.6', java: 21 }
          - { minecraft: '1.21.10', java: 21 }
          - { minecraft: '1.21.11', java: 21 }
          - { minecraft: '26.3', java: 25 }
    steps:
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vpp-spigot/${{ matrix.minecraft }}
          key: spigot-${{ matrix.minecraft }}-bt${{ env.BUILDTOOLS_BUILD }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build Spigot ${{ matrix.minecraft }} with BuildTools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildtools ~/.cache/vpp-spigot/${{ matrix.minecraft }}
          cd buildtools
          curl -fsSL --retry 3 -o BuildTools.jar "https://hub.spigotmc.org/jenkins/job/BuildTools/${BUILDTOOLS_BUILD}/artifact/target/BuildTools.jar"
          echo "${BUILDTOOLS_SHA256}  BuildTools.jar" | sha256sum -c -
          java -jar BuildTools.jar --rev "${{ matrix.minecraft }}" --compile spigot --output-dir "$HOME/.cache/vpp-spigot/${{ matrix.minecraft }}"
          ls -l "$HOME/.cache/vpp-spigot/${{ matrix.minecraft }}"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vpp-spigot/${{ matrix.minecraft }}
          key: spigot-${{ matrix.minecraft }}-bt${{ env.BUILDTOOLS_BUILD }}

  smoke:
    name: ${{ matrix.software }} ${{ matrix.minecraft }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Paper and Folia builds are pinned so runs are reproducible; bump them deliberately.
        # Keep in step with SupportedVersions in
        # core/src/main/java/io/github/soul4723/vanillapermissions/util/SupportedVersions.java
        # (SupportedVersionsTest compares each software's rows with its list).
        # min_nodes becomes MIN_NODES for the script (default 1000 when a row has none): 797 nodes were counted on
        # 1.13.2, 1259 on 1.16.5, 1297 on 1.17.1, 1663 on 1.19.4 and 1741 on 1.20.4; rows get about 10% below that.
        # Folia removes commands: measured 884, 1062, 1086 and 1116 nodes; floors allow about 10% headroom.
        # Purpur and Pufferfish are Paper forks: the newest build of each minor line (every Pufferfish
        # build that exists is pinned inside scripts/compat-smoke.sh). Full results are in docs/compatibility.md.
        include:
          - { software: paper, minecraft: '1.8.8', build: 445, java: 8, min_nodes: 120 }
          - { software: paper, minecraft: '1.12.2', build: 1620, java: 8, min_nodes: 130 }
          - { software: paper, minecraft: '1.13.2', build: 657, java: 8, min_nodes: 720 }
          - { software: paper, minecraft: '1.16.5', build: 794, java: 8, min_nodes: 1130 }
          - { software: paper, minecraft: '1.17.1', build: 411, java: 17, min_nodes: 1170 }
          - { software: paper, minecraft: '1.18.2', build: 388, java: 17, min_nodes: 1170 }
          - { software: paper, minecraft: '1.19.4', build: 550, java: 17, min_nodes: 1500 }
          - { software: paper, minecraft: '1.20.4', build: 499, java: 17, min_nodes: 1570 }
          - { software: paper, minecraft: '1.20.5', build: 22, java: 21, min_nodes: 1600 }
          - { software: paper, minecraft: '1.20.6', build: 151, java: 21 }
          - { software: paper, minecraft: '1.21', build: 130, java: 21 }
          - { software: paper, minecraft: '1.21.1', build: 133, java: 21 }
          - { software: paper, minecraft: '1.21.3', build: 83, java: 21 }
          - { software: paper, minecraft: '1.21.4', build: 232, java: 21 }
          - { software: paper, minecraft: '1.21.5', build: 114, java: 21 }
          - { software: paper, minecraft: '1.21.6', build: 48, java: 21 }
          - { software: paper, minecraft: '1.21.7', build: 32, java: 21 }
          - { software: paper, minecraft: '1.21.8', build: 60, java: 21 }
          - { software: paper, minecraft: '1.21.9', build: 59, java: 21 }
          - { software: paper, minecraft: '1.21.10', build: 130, java: 21 }
          - { software: paper, minecraft: '1.21.11', build: 132, java: 21 }
          - { software: paper, minecraft: '26.1.1', build: 29, java: 25 }
          - { software: paper, minecraft: '26.1.2', build: 74, java: 25 }
          - { software: paper, minecraft: '26.2', build: 134, java: 25 }
          - { software: paper, minecraft: '26.3', build: 206, java: 25 }
          - { software: folia, minecraft: '1.20.6', build: 6, java: 21, min_nodes: 795 }
          - { software: folia, minecraft: '1.21.11', build: 14, java: 21, min_nodes: 950 }
          - { software: folia, minecraft: '26.1.2', build: 8, java: 25, min_nodes: 975 }
          - { software: folia, minecraft: '26.3', build: 3, java: 25, min_nodes: 1000 }
          - { software: purpur, minecraft: '1.20.6', build: 2233, java: 21 }
          - { software: purpur, minecraft: '1.21.11', build: 2568, java: 21 }
          - { software: purpur, minecraft: '26.1.2', build: 2592, java: 25 }
          - { software: purpur, minecraft: '26.2', build: 2633, java: 25 }
          - { software: purpur, minecraft: '26.3', build: 2652, java: 25 }
          # Drop Pufferfish rows (and SupportedVersions entries) when ci.pufferfish.host goes away.
          - { software: pufferfish, minecraft: '1.21.1', build: 21, java: 21 }
          - { software: pufferfish, minecraft: '1.21.10', build: 39, java: 21 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: VanillaPermissionsPlugin-compat
          path: plugin
      - id: server-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/vpp-compat/${{ matrix.software }}
            ~/.cache/vpp-compat/server/${{ matrix.software }}-${{ matrix.minecraft }}
          key: server-${{ matrix.software }}-${{ matrix.minecraft }}-${{ matrix.build }}
      - id: luckperms-cache
        if: matrix.java < 11
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vpp-compat/luckperms
          key: luckperms-java8-${{ hashFiles('scripts/compat-smoke.sh') }}
      - name: Boot ${{ matrix.software }} with the plugin
        env:
          LOG_DIR: ${{ runner.temp }}/server-logs
          MIN_NODES: ${{ matrix.min_nodes }}
        run: |
          jar=$(ls plugin/VanillaPermissionsPlugin-*.jar)
          bash scripts/compat-smoke.sh "${{ matrix.minecraft }}" "$jar" --software "${{ matrix.software }}" --build "${{ matrix.build }}"
      - if: github.event_name != 'pull_request' && steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/vpp-compat/${{ matrix.software }}
            ~/.cache/vpp-compat/server/${{ matrix.software }}-${{ matrix.minecraft }}
          key: server-${{ matrix.software }}-${{ matrix.minecraft }}-${{ matrix.build }}
      - if: matrix.java < 11 && github.event_name != 'pull_request' && steps.luckperms-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vpp-compat/luckperms
          key: luckperms-java8-${{ hashFiles('scripts/compat-smoke.sh') }}
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-${{ matrix.software }}-${{ matrix.minecraft }}
          path: ${{ runner.temp }}/server-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  smoke-spigot:
    name: ${{ matrix.software }} ${{ matrix.minecraft }}
    needs: [package, spigot-jar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The same rows as SupportedVersions' Spigot list; the jar comes from the spigot-jar job's cache.
        # 1780 nodes were counted on 1.20.6, 1951 on 1.21.10, 2081 on 1.21.11 and 2487 on 26.3; rows get about 10% below.
        include:
          - { software: spigot, minecraft: '1.8.8', java: 8, min_nodes: 120 }
          - { software: spigot, minecraft: '1.12.2', java: 8, min_nodes: 130 }
          - { software: spigot, minecraft: '1.13.2', java: 8, min_nodes: 720 }
          - { software: spigot, minecraft: '1.16.5', java: 8, min_nodes: 1130 }
          - { software: spigot, minecraft: '1.17.1', java: 17, min_nodes: 1170 }
          - { software: spigot, minecraft: '1.18.2', java: 17, min_nodes: 1170 }
          - { software: spigot, minecraft: '1.19.4', java: 17, min_nodes: 1500 }
          - { software: spigot, minecraft: '1.20.4', java: 17, min_nodes: 1570 }
          - { software: spigot, minecraft: '1.20.6', java: 21, min_nodes: 1600 }
          - { software: spigot, minecraft: '1.21.10', java: 21, min_nodes: 1750 }
          - { software: spigot, minecraft: '1.21.11', java: 21, min_nodes: 1870 }
          - { software: spigot, minecraft: '26.3', java: 25, min_nodes: 2240 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: VanillaPermissionsPlugin-compat
          path: plugin
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vpp-spigot/${{ matrix.minecraft }}
          key: spigot-${{ matrix.minecraft }}-bt${{ env.BUILDTOOLS_BUILD }}
          fail-on-cache-miss: true
      - id: server-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/vpp-compat/${{ matrix.software }}
            ~/.cache/vpp-compat/server/${{ matrix.software }}-${{ matrix.minecraft }}
          key: server-spigot-${{ matrix.minecraft }}-bt${{ env.BUILDTOOLS_BUILD }}
      - id: luckperms-cache
        if: matrix.java < 11
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vpp-compat/luckperms
          key: luckperms-java8-${{ hashFiles('scripts/compat-smoke.sh') }}
      - name: Boot Spigot with the plugin
        env:
          LOG_DIR: ${{ runner.temp }}/server-logs
          MIN_NODES: ${{ matrix.min_nodes }}
        run: |
          jar=$(ls plugin/VanillaPermissionsPlugin-*.jar)
          bash scripts/compat-smoke.sh "${{ matrix.minecraft }}" "$jar" --software spigot --build "bt${BUILDTOOLS_BUILD}" \
            --server-jar "$HOME/.cache/vpp-spigot/${{ matrix.minecraft }}/spigot-${{ matrix.minecraft }}.jar"
      - if: github.event_name != 'pull_request' && steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/vpp-compat/${{ matrix.software }}
            ~/.cache/vpp-compat/server/${{ matrix.software }}-${{ matrix.minecraft }}
          key: server-spigot-${{ matrix.minecraft }}-bt${{ env.BUILDTOOLS_BUILD }}
      - if: matrix.java < 11 && github.event_name != 'pull_request' && steps.luckperms-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vpp-compat/luckperms
          key: luckperms-java8-${{ hashFiles('scripts/compat-smoke.sh') }}
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-${{ matrix.software }}-${{ matrix.minecraft }}
          path: ${{ runner.temp }}/server-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Aggregate required check, following pypa/setuptools .github/workflows/main.yml's check job.
  compat:
    if: always()
    needs: [package, spigot-jar, smoke, smoke-spigot]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
