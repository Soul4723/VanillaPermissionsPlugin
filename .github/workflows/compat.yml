name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: VanillaPermissionsPlugin-compat
          path: target/VanillaPermissionsPlugin-*.jar
          if-no-files-found: error

  smoke:
    name: Paper ${{ matrix.minecraft }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Paper builds are pinned so runs are reproducible; bump them deliberately.
        # Keep in step with SupportedVersions.VERIFIED in
        # src/main/java/io/github/soul4723/vanillapermissions/util/SupportedVersions.java
        include:
          - { minecraft: '1.20.6', build: 151, java: 21 }
          - { minecraft: '1.21', build: 130, java: 21 }
          - { minecraft: '1.21.1', build: 133, java: 21 }
          - { minecraft: '1.21.3', build: 83, java: 21 }
          - { minecraft: '1.21.4', build: 232, java: 21 }
          - { minecraft: '1.21.5', build: 114, java: 21 }
          - { minecraft: '1.21.6', build: 48, java: 21 }
          - { minecraft: '1.21.7', build: 32, java: 21 }
          - { minecraft: '1.21.8', build: 60, java: 21 }
          - { minecraft: '1.21.9', build: 59, java: 21 }
          - { minecraft: '1.21.10', build: 130, java: 21 }
          - { minecraft: '1.21.11', build: 132, java: 21 }
          - { minecraft: '26.1.1', build: 29, java: 25 }
          - { minecraft: '26.1.2', build: 74, java: 25 }
          - { minecraft: '26.2', build: 134, java: 25 }
          - { minecraft: '26.3', build: 206, java: 25 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: VanillaPermissionsPlugin-compat
          path: plugin
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vpp-compat
          key: paper-${{ matrix.minecraft }}-${{ matrix.build }}-lp-5.5.87
      - name: Boot Paper with the plugin
        run: |
          jar=$(ls plugin/VanillaPermissionsPlugin-*.jar)
          bash scripts/compat-smoke.sh "${{ matrix.minecraft }}" "$jar" --build "${{ matrix.build }}"
