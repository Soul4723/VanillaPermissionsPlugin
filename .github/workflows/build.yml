name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -DincludeScope=test -Dmdep.outputFile=target/test-classpath.txt
      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          check_cp="target/classes:target/test-classes:$(cat target/test-classpath.txt)"
          for check in \
            CommandPermissionsCheck \
            ForceGamemodeContextCheck \
            io.github.soul4723.vanillapermissions.util.NativeCommandPermissionsCheck \
            io.github.soul4723.vanillapermissions.util.SelectorPolicyCheck
          do
            java -ea -cp "$check_cp" "$check"
          done
          javac --release 21 -cp "$check_cp" -d target/test-classes \
            tests/NativeFeedbackCheck.java tests/MoveSpeedBypassCheck.java
          java -ea -cp "$check_cp" NativeFeedbackCheck
          java -ea -cp "$check_cp" MoveSpeedBypassCheck
