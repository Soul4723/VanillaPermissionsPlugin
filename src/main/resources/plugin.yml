name: VanillaPermissionsPlugin
version: ${project.version}
main: io.github.soul4723.vanillapermissions.VanillaPermissionsPlugin
api-version: '1.20'
author: Soul4723
description: "${project.description}"
website: ${project.url}

depend: [LuckPerms]

commands:
  vanillapermissions:
    description: Inspect how LuckPerms resolves VanillaPermissionsPlugin nodes
    usage: "/<command> check <player> [node] | /<command> debug"
    permission: vanillapermissions.use

permissions:
  vanillapermissions.use:
    description: Run /vanillapermissions and see its help
    default: op
  vanillapermissions.admin:
    description: Use /vanillapermissions check and debug
    default: op
    children:
      vanillapermissions.use: true
