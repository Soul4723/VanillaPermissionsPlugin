name: VanillaPermissionsPlugin
version: ${project.version}
main: io.github.soul4723.vanillapermissions.VanillaPermissionsPlugin
# Mark the plugin as 1.13 compatible to avoid CB having to perform quite as much unnecessary remapping when the plugin is
# loaded. Note that despite what this setting might otherwise imply, VanillaPermissionsPlugin is still compatible with
# pre-1.13 releases. (Comment adapted from LuckPerms' bukkit/loader/src/main/resources/plugin.yml.)
api-version: '1.13'
# Opt in to Folia, as LuckPerms does; other servers ignore this key.
folia-supported: true
author: Soul4723
description: "${project.description}"
website: ${project.url}

softdepend: [LuckPerms, Vault]

commands:
  vanillapermissions:
    description: Inspect how VanillaPermissionsPlugin nodes resolve
    usage: "/<command> check <player> [node] | /<command> debug"
    permission: vanillapermissions.use

permissions:
  vanillapermissions.use:
    description: Run /vanillapermissions and see its help
    default: op
  vanillapermissions.admin:
    description: Use /vanillapermissions check and debug
    default: op
    children:
      vanillapermissions.use: true
  minecraft.selector:
    description: Type @ selectors; also passes Paper's parse-time selector check (1.21.3+)
    default: op
    children:
      minecraft.command.selector: true
  minecraft.bypass.whitelist:
    description: Join while not whitelisted
    default: false
  minecraft.bypass.player-limit:
    description: Join when the server is full
    default: false
  minecraft.bypass.force-gamemode:
    description: Keep your game mode when the server forces the default game mode
    default: false
  minecraft.bypass.move-speed.player:
    description: Skip the "moved too quickly" and "moved wrongly" checks
    default: false
